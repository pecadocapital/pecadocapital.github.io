<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pecado Caja">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pecado Capital · Caja y Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#ff3b3b;--red2:#e11d2a;--gold:#ffc400;--gold2:#ff9f0a;--bg:#0e0a09;--bg2:#161110;--card:#1c1614;--card2:#241c19;--line:#2e2522;--txt:#f7f1ed;--mut:#a39791;--ok:#34d399;--blue:#60a5fa;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Poppins,system-ui,sans-serif;font-size:15px}
body{background:radial-gradient(1200px 500px at 85% -10%,rgba(255,59,59,.16),transparent 60%),radial-gradient(900px 400px at -10% 0%,rgba(255,196,0,.08),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
header{position:sticky;top:0;z-index:20;background:rgba(14,10,9,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.05);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--red),#8b0a12);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 18px rgba(255,59,59,.35)}
.brand{font-family:Anton,sans-serif;font-size:21px;letter-spacing:.6px;line-height:1;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:11px;color:var(--mut);line-height:1.3}
.sp{flex:1}
#sync{font-size:11px;padding:5px 10px;border-radius:99px;background:var(--card2);color:var(--mut);white-space:nowrap;display:flex;align-items:center;gap:6px}
#sync::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
#sync.ok{color:var(--ok);background:rgba(52,211,153,.1)}#sync.local{color:var(--gold);background:rgba(255,196,0,.1)}
main{padding:16px 14px calc(100px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;z-index:30;background:rgba(28,22,20,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.07);border-radius:24px;display:flex;padding:6px;max-width:740px;margin:0 auto;box-shadow:0 12px 40px rgba(0,0,0,.5)}
nav a{flex:1;text-align:center;text-decoration:none;color:var(--mut);font-size:10.5px;font-weight:600;padding:7px 0 5px;border-radius:18px;position:relative;transition:.2s}
nav a svg{display:block;margin:0 auto 2px;width:23px;height:23px}
nav a.on{color:#fff;background:linear-gradient(135deg,var(--red),#b5121b);box-shadow:0 6px 16px rgba(255,59,59,.35)}
nav a .dot{position:absolute;top:2px;right:16%;background:var(--gold);color:#000;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;line-height:17px;padding:0 4px}
h2{font-family:Anton,sans-serif;font-weight:400;font-size:30px;margin:2px 0 4px;letter-spacing:.4px}
.lead{color:var(--mut);font-size:13px;margin:0 0 14px}
h3{font-size:12px;margin:22px 2px 10px;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border-radius:var(--r);padding:14px;border:1px solid var(--line);margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}.small{font-size:12px}
.big{font-family:Anton,sans-serif;font-size:30px;line-height:1.1;letter-spacing:.3px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:13px}
.kpi.hero{grid-column:1/-1;background:linear-gradient(135deg,#ff3b3b 0%,#b5121b 55%,#5a070c 100%);border:0;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(255,59,59,.25)}
.kpi.hero::after{content:"🍕";position:absolute;right:-10px;bottom:-26px;font-size:120px;opacity:.13;transform:rotate(-18deg)}
.kpi.hero .mut{color:rgba(255,255,255,.75)}.kpi.hero .big{font-size:42px;color:#fff}
.pos{color:var(--ok)!important}.neg{color:var(--red)!important}
.delta{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;margin-left:6px}
.delta.up{background:rgba(52,211,153,.15);color:var(--ok)}.delta.down{background:rgba(255,59,59,.15);color:var(--red)}
.kpi.hero .delta{background:rgba(0,0,0,.25);color:#fff}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:transparent;padding:8px 11px;border-radius:10px;font-weight:600;font-size:13px;color:var(--mut);white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--txt);color:#000}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:linear-gradient(135deg,var(--red),#c0141e);color:#fff;cursor:pointer;transition:transform .1s;text-decoration:none;display:inline-block;text-align:center}
.btn:active{transform:scale(.97)}
.btn.block{width:100%;display:block;font-size:16px;padding:16px}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a0f00}
.btn.green{background:linear-gradient(135deg,#25d366,#128c4a)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.4;pointer-events:none}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.bar{height:7px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:6px}
.cats{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pbtn{border:1px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));border-radius:22px;padding:14px 12px 12px;text-align:left;cursor:pointer;position:relative;min-height:128px;transition:.15s;color:var(--txt)}
.pbtn:active{transform:scale(.96)}
.pbtn .em{font-size:34px;line-height:1;display:block;margin-bottom:8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.pbtn b{display:block;font-size:14.5px;line-height:1.25}
.pbtn .pr{font-family:Anton,sans-serif;font-size:21px;color:var(--gold);margin-top:4px}
.pbtn .q{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-weight:800;border-radius:99px;min-width:28px;height:28px;line-height:28px;text-align:center;font-size:14px;box-shadow:0 4px 12px rgba(255,59,59,.5);animation:pop .25s}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.pbtn.in{border-color:var(--red);box-shadow:0 0 0 2px rgba(255,59,59,.25),0 10px 24px rgba(255,59,59,.12)}
.cart{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;padding:0 10px;animation:in .2s}
.cart .in{max-width:740px;margin:0 auto;background:rgba(36,28,25,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:12px;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:99px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a0f00}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-weight:700;font-size:18px;line-height:1;cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--mut)}
.tag.red{background:rgba(255,59,59,.15);color:#ff7b7b}.tag.ok{background:rgba(52,211,153,.13);color:var(--ok)}.tag.warn{background:rgba(255,196,0,.14);color:var(--gold)}.tag.blue{background:rgba(96,165,250,.14);color:var(--blue)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.empty .e{font-size:40px;display:block;margin-bottom:6px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 5px}
.inp{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--bg2);font-size:16px;color:var(--txt)}
.inp:focus{outline:2px solid var(--gold);border-color:transparent}
select.inp{appearance:none}
input[type=date].inp{color-scheme:dark}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;animation:up .25s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
#sheet .grab{width:44px;height:5px;background:#3a302c;border-radius:3px;margin:0 auto 12px}
#toast{position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);opacity:0;background:#fff;color:#000;padding:11px 18px;border-radius:14px;font-weight:700;z-index:60;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:rgba(255,196,0,.08);border:1px solid rgba(255,196,0,.25);color:#ffd866;border-radius:14px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.wa{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#25d366,#128c4a);color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:8px 12px;border-radius:11px}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:70px 0;color:var(--mut)}
.spin{width:36px;height:36px;border:4px solid var(--card2);border-top-color:var(--red);border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.right{text-align:right}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;font-family:Anton,sans-serif;font-size:22px}
.chart{width:100%;height:auto;display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--txt);display:block}
.tile .e{font-size:30px}.tile b{display:block;margin-top:8px}.tile span{font-size:12px;color:var(--mut)}
.timer{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--mut)}
.timer.late{background:rgba(255,59,59,.15);color:#ff7b7b}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a0f00;flex:none}
.sumline{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:2px 0}
.sumline b{color:var(--txt)}
.receipt{background:#fff;color:#111;border-radius:18px;padding:18px;font-size:13px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;line-height:1.5}
.emopick{display:flex;gap:6px;flex-wrap:wrap}.emopick button{font-size:24px;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer}.emopick button.on{border-color:var(--gold);background:rgba(255,196,0,.15)}
</style>
</head>
<body>
<header>
  <div class="logo">🍕</div>
  <div><div class="brand" id="bizName">PECADO CAPITAL</div><div class="sub">Caja y control · El Monito</div></div>
  <div class="sp"></div><div id="sync">Conectando</div>
</header>
<main id="view"><div class="loading"><div class="spin"></div>Cargando datos…</div></main>
<div id="cartbar"></div>
<nav id="nav"></nav>
<div id="sheet"><div class="bg" data-close></div><div class="pane"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => { const v=Math.round(Number(n)||0); return (v<0?"-$":"$") + Math.abs(v).toLocaleString("es-CO"); };
const short = n => { const v=Math.abs(n); return (n<0?"-":"")+(v>=1e6?(v/1e6).toFixed(1).replace(".0","")+"M":v>=1e3?Math.round(v/1e3)+"k":String(Math.round(v))); };
const num = v => { const n = parseFloat(String(v).replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",", ".")); return isFinite(n) ? n : 0; };
const qnum = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const dkey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayKey = () => dkey(new Date());
const kdate = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d=kdate(k); d.setDate(d.getDate()+n); return dkey(d); };
const hora = ts => { const d=new Date(ts); let h=d.getHours(); const ap=h>=12?"pm":"am"; h=h%12||12; return h+":"+pad(d.getMinutes())+" "+ap; };
const DIAS=["dom","lun","mar","mié","jue","vie","sáb"], MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fechaLarga = k => { const d=kdate(k); return DIAS[d.getDay()]+" "+d.getDate()+" de "+MESES[d.getMonth()]; };
const fmtQ = n => (Math.round((Number(n)||0)*100)/100).toLocaleString("es-CO");
const minsAgo = ts => Math.max(0,Math.round((Date.now()-ts)/60000));
const telDigits = t => { let d=String(t||"").replace(/\D/g,""); if(d.length===12&&d.startsWith("57")) d=d.slice(2); return d; };
const waLink = (tel,txt) => { let t=telDigits(tel); if(t.length===10) t="57"+t; return t?`https://wa.me/${t}?text=${encodeURIComponent(txt)}`:""; };
const vibe = () => { try{ navigator.vibrate && navigator.vibrate(12); }catch(e){} };
const initials = n => (String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("")||"?").toUpperCase();
const METODOS=["Efectivo","Nequi","Daviplata","Transferencia","Tarjeta"];
const CATS=["Insumos","Arriendo","Servicios","Transporte","Nómina","Empaques","Publicidad","Otros"];
const PCATS=["Pizzas","Bebidas","Adicionales","Combos","Postres"];
const EMOJIS=["🍕","🍔","🌭","🍟","🧀","🥓","🍍","🍗","🥤","🧃","🍺","☕","🍰","🍦","🥗","🎁"];
const ESTADOS=[["pendiente","Pendiente","warn"],["horno","En el horno","red"],["listo","Listo","blue"],["entregado","Entregado","ok"]];
const WINDOW_DAYS=70;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2300); }

/* ============ state ============ */
const S={cat:null,catLoaded:false,ventas:{},gastos:{},pedidos:{},clientes:{},cajas:{},ajustes:{},mode:"loading",readOnly:false,
  cart:{},metodo:"Efectivo",descuento:0,recibido:"",pcat:"Todas",periodo:"hoy",invTab:"insumos",pedTab:"activos",histDay:null,histCache:{},cliQ:""};

/* ============ storage ============ */
function localStore(){
  const P="pc1:", subs=[];
  const read=k=>{ try{ const v=localStorage.getItem(P+k); return v?JSON.parse(v):null; }catch(e){ return null; } };
  const keys=()=>{ const o=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(P)) o.push(k.slice(P.length)); } }catch(e){} return o; };
  const emit=()=>subs.forEach(f=>f());
  return {
    watchDoc(path,cb){ const f=()=>cb(read(path)); subs.push(f); setTimeout(f,0); },
    watchCol(col,cb){ const f=()=>{ const out={}; keys().filter(k=>k.startsWith(col+"/")&&k.split("/").length===2).forEach(k=>{ out[k.split("/")[1]]=read(k); }); cb(out); }; subs.push(f); setTimeout(f,0); },
    async get(path){ return read(path); },
    async set(path,data){ try{ localStorage.setItem(P+path,JSON.stringify(data)); }catch(e){ toast("No se pudo guardar en este teléfono"); throw e; } emit(); },
    async del(path){ try{ localStorage.removeItem(P+path); }catch(e){} emit(); }
  };
}
function dbStore(db){
  const chains={};
  const run=(path,fn)=>{ const p=(chains[path]||Promise.resolve()).catch(()=>{}).then(fn); chains[path]=p; return p; };
  const fail=e=>{ if(e&&e.code==="invalid_argument"){ S.readOnly=true; render(); toast("Solo puedes ver: no tienes permiso para guardar"); } else if(e&&e.code==="quota_exceeded"){ toast("Se llenó el espacio de datos"); } else toast("No se pudo guardar. Revisa tu conexión."); throw e; };
  return {
    watchDoc(path,cb){ db.doc(path).onSnapshot(s=>{ markSynced(s.metadata); cb(s.exists?s.data():null); },syncErr); },
    watchCol(col,cb,since){ let q=db.collection(col); if(since) q=q.where("fecha",">=",since); q.onSnapshot(s=>{ markSynced(s.metadata); const out={}; s.docs.forEach(d=>{ out[d.id]=d.data(); }); cb(out); },syncErr); },
    async get(path){ try{ const s=await db.doc(path).get(); return s.exists?s.data():null; }catch(e){ return null; } },
    set(path,data){ return run(path,()=>db.doc(path).set(JSON.parse(JSON.stringify(data))).catch(fail)); },
    del(path){ return run(path,()=>db.doc(path).delete().catch(fail)); }
  };
}
let store=null, loadTimer=null;
function markSynced(md){ if(md&&!md.fromCache){ clearTimeout(loadTimer); setSync("ok","En línea"); } }
function syncErr(){ clearTimeout(loadTimer); setSync("local","Sin conexión"); }
function setSync(c,t){ const el=$("#sync"); el.className=c; el.textContent=t; }
const DEFAULT_CAT={productos:[
  {id:"hawaiana",nombre:"Pizza Hawaiana",precio:10000,activo:true,cat:"Pizzas",emoji:"🍍",receta:[{iid:"masa",cant:1},{iid:"caja",cant:1}]},
  {id:"carnes",nombre:"Pizza de Carnes",precio:12000,activo:true,cat:"Pizzas",emoji:"🥓",receta:[{iid:"masa",cant:1},{iid:"caja",cant:1}]},
  {id:"burguer",nombre:"Pizza Burguer",precio:13000,activo:true,cat:"Pizzas",emoji:"🍔",receta:[{iid:"masa",cant:1},{iid:"caja",cant:1}]},
  {id:"frutas",nombre:"Pizza de Frutas",precio:12000,activo:true,cat:"Pizzas",emoji:"🍕",receta:[{iid:"masa",cant:1},{iid:"caja",cant:1}]}],
  insumos:[{id:"masa",nombre:"Bases de masa",unidad:"unid",stock:0,minimo:10},{id:"queso",nombre:"Queso mozzarella",unidad:"g",stock:0,minimo:1000},{id:"salsa",nombre:"Salsa de tomate",unidad:"g",stock:0,minimo:500},{id:"caja",nombre:"Cajas para pizza",unidad:"unid",stock:0,minimo:10}]};
const sinceKey=()=>addDays(todayKey(),-WINDOW_DAYS);
function start(mode){
  if(store) return; S.mode=mode.kind;
  store = mode.kind==="db"?dbStore(mode.db):localStore();

/* ============ periods ============ */
function rangeFor(p){ const t=todayKey(), now=new Date();
  if(p==="hoy") return [t,t];
  if(p==="ayer"){ const y=addDays(t,-1); return [y,y]; }
  if(p==="semana"){ const wd=(now.getDay()+6)%7; return [addDays(t,-wd),t]; }
  if(p==="mes") return [dkey(new Date(now.getFullYear(),now.getMonth(),1)),t];
  return [dkey(new Date(now.getFullYear(),now.getMonth()-1,1)),dkey(new Date(now.getFullYear(),now.getMonth(),0))]; }
function prevRange(p){ const [a,b]=rangeFor(p); const t=todayKey(), now=new Date();
  if(p==="hoy"||p==="ayer") return [addDays(a,-1),addDays(b,-1)];
  if(p==="semana"){ const n=Math.round((kdate(b)-kdate(a))/864e5); return [addDays(a,-7),addDays(a,-7+n)]; }
  if(p==="mes"){ const d=now.getDate(); const s=new Date(now.getFullYear(),now.getMonth()-1,1); const e=new Date(now.getFullYear(),now.getMonth()-1,Math.min(d,new Date(now.getFullYear(),now.getMonth(),0).getDate())); return [dkey(s),dkey(e)]; }
  return [dkey(new Date(now.getFullYear(),now.getMonth()-2,1)),dkey(new Date(now.getFullYear(),now.getMonth()-1,0))]; }
const PER_LABEL={hoy:"Hoy",ayer:"Ayer",semana:"Semana",mes:"Mes",mespasado:"Mes pasado"};
const PREV_LABEL={hoy:"ayer",ayer:"anteayer",semana:"semana pasada",mes:"mes pasado",mespasado:"mes anterior"};
function collectR(map,a,b){ const o=[]; Object.keys(map).forEach(k=>{ if(k>=a&&k<=b) (map[k]?.items||[]).forEach(x=>o.push(Object.assign({_k:k},x))); }); return o.sort((x,y)=>y.ts-x.ts); }
function resumenR(a,b){
  const vs=collectR(S.ventas,a,b), gs=collectR(S.gastos,a,b);
  const ventas=vs.reduce((s,v)=>s+(v.total||0),0), gastos=gs.reduce((s,g)=>s+(g.monto||0),0);
  const met={}, top={}, cats={}, horas=new Array(24).fill(0);
  vs.forEach(v=>{ met[v.metodo]=(met[v.metodo]||0)+(v.total||0); horas[new Date(v.ts).getHours()]+=v.total||0; (v.items||[]).forEach(i=>{ const t=top[i.nombre]||(top[i.nombre]={cant:0,total:0}); t.cant+=i.cant; t.total+=i.cant*i.precio; }); });
  gs.forEach(g=>{ cats[g.categoria]=(cats[g.categoria]||0)+(g.monto||0); });
  const pizzas=vs.reduce((s,v)=>s+(v.items||[]).reduce((x,i)=>x+i.cant,0),0);
  return {vs,gs,ventas,gastos,ganancia:ventas-gastos,met,top,cats,horas,n:vs.length,pizzas};
}
const resumen=p=>{ const [a,b]=rangeFor(p); return resumenR(a,b); };
function deltaTag(cur,prev,lbl){ if(!prev&&!cur) return ""; if(!prev) return `<span class="delta up">nuevo</span>`; const d=Math.round((cur-prev)/Math.abs(prev)*100); return `<span class="delta ${d>=0?"up":"down"}" title="vs ${lbl}">${d>=0?"▲":"▼"} ${Math.abs(d)}%</span>`; }

/* ============ charts ============ */
function ring(pct,label){ const r=40,c=2*Math.PI*r,v=Math.max(0,Math.min(1,pct)); return `<div class="ring"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="${r}" fill="none" stroke="#2e2522" stroke-width="10"/><circle cx="48" cy="48" r="${r}" fill="none" stroke="url(#gr)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v)}" style="transition:stroke-dashoffset .8s"/><defs><linearGradient id="gr"><stop offset="0" stop-color="#ff3b3b"/><stop offset="1" stop-color="#ffc400"/></linearGradient></defs></svg><div class="c">${label}</div></div>`; }
function barsChart(days){ // days: [{k,v,g}]
  const W=340,H=150,pb=22,pt=16, max=Math.max(1,...days.map(d=>Math.max(d.v,d.g))); const bw=W/days.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">`+days.map((d,i)=>{ const x=i*bw, hv=(H-pb-pt)*d.v/max, hg=(H-pb-pt)*d.g/max, isT=d.k===todayKey(), dd=kdate(d.k);
    return `<rect x="${x+bw*.18}" y="${H-pb-hv}" width="${bw*.34}" height="${Math.max(hv,1.5)}" rx="4" fill="${isT?"#ffc400":"#ff3b3b"}"/><rect x="${x+bw*.54}" y="${H-pb-hg}" width="${bw*.28}" height="${Math.max(hg,1.5)}" rx="4" fill="#4b3d38"/>${d.v?`<text x="${x+bw*.35}" y="${H-pb-hv-4}" fill="#cfc4be" font-size="9" text-anchor="middle">${short(d.v)}</text>`:""}<text x="${x+bw/2}" y="${H-6}" fill="${isT?"#ffc400":"#a39791"}" font-size="10" font-weight="600" text-anchor="middle">${DIAS[dd.getDay()]}</text>`; }).join("")+`</svg>`; }
function hoursChart(h){ let a=24,b=-1; h.forEach((v,i)=>{ if(v){ a=Math.min(a,i); b=Math.max(b,i); } }); if(b<0) return ""; a=Math.max(0,a-1); b=Math.min(23,b+1);
  const arr=h.slice(a,b+1), W=340,H=110,pb=20, max=Math.max(1,...arr), bw=W/arr.length, peak=arr.indexOf(Math.max(...arr));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">`+arr.map((v,i)=>{ const hh=(H-pb-8)*v/max, hr=a+i, l=(hr%12||12)+(hr>=12?"p":"a"); return `<rect x="${i*bw+bw*.15}" y="${H-pb-hh}" width="${bw*.7}" height="${Math.max(hh,1.5)}" rx="4" fill="${i===peak?"#ffc400":"#ff3b3b"}" opacity="${v?1:.25}"/><text x="${i*bw+bw/2}" y="${H-5}" fill="#a39791" font-size="9" text-anchor="middle">${l}</text>`; }).join("")+`</svg>`; }

  </div></div>`;
  const d=$("#cDesc"); d.oninput=()=>{ S.descuento=num(d.value); updTotals(); };

}
function updTotals(){ // update without rerender to keep focus
  const items=cartItems(), sub=items.reduce((a,i)=>a+i.precio*i.cant,0), total=sub-Math.min(sub,S.descuento||0);
  const b=document.querySelector('[data-act=cobrar]'); if(b) b.textContent="Cobrar "+money(total);
  const rec=num(S.recibido), box=$("#cartbar .in"); let line=box.querySelector("#vueltas");
  if(S.metodo==="Efectivo"&&rec>0){ const c=rec-total; if(!line){ line=document.createElement("div"); line.id="vueltas"; line.className="row small"; line.style.margin="-2px 2px 8px"; box.insertBefore(line, box.lastElementChild); }
    line.innerHTML=`<span class="grow mut">Vueltas</span><b class="${c<0?"neg":"pos"}" style="font-size:16px">${c<0?"Faltan "+money(-c):money(c)}</b>`; } else if(line) line.remove();
}
function reciboTexto(v){
  const n=S.ajustes.nombre||"Pecado Capital";
  let t=`🍕 ${n.toUpperCase()}\n${fechaLarga(dkey(new Date(v.ts)))} · ${hora(v.ts)}\n${v.cliente?"Cliente: "+v.cliente+"\n":""}------------------------\n`;
  v.items.forEach(i=>{ t+=`${i.cant} x ${i.nombre}\n    ${money(i.precio*i.cant)}\n`; });
  t+=`------------------------\n`; if(v.descuento) t+=`Descuento: -${money(v.descuento)}\n`; if(v.domicilio) t+=`Domicilio: ${money(v.domicilio)}\n`;
  t+=`TOTAL: ${money(v.total)}\nPago: ${v.metodo}\n\n¡Gracias por tu compra! 🔥\n${S.ajustes.whatsapp?"Pedidos: "+S.ajustes.whatsapp:""}`;
  return t.trim();
}
function showRecibo(v){

  openSheet(`<h2 style="font-size:24px">Recibo</h2><div class="receipt">${esc(txt)}</div>
  <label class="f">Enviar por WhatsApp a</label><input class="inp" id="rTel" inputmode="tel" placeholder="300 123 4567" value="${esc(v.tel||"")}">
  <div class="row" style="margin-top:12px"><button class="btn ghost grow" id="rCopy">Copiar</button><a class="btn green grow" id="rWa" href="#" target="_blank" rel="noopener">WhatsApp</a></div>`, b=>{

function pedidoCard(p){

  ${idx>=0?`<div class="row" style="gap:4px;margin-bottom:10px">${steps}</div>`:""}
  ${p.dir?`<div class="small" style="margin-bottom:4px">📍 ${esc(p.dir)}</div>`:""}
  <div style="margin:6px 0">${(p.items||[]).map(i=>`<div class="sumline"><span>${i.cant}× ${esc(i.nombre)}</span><b>${money(i.precio*i.cant)}</b></div>`).join("")}${p.domicilio?`<div class="sumline"><span>Domicilio</span><b>${money(p.domicilio)}</b></div>`:""}</div>
  ${p.notas?`<div class="small" style="background:var(--card2);border-radius:10px;padding:7px 9px;margin-bottom:8px">📝 ${esc(p.notas)}</div>`:""}

  ${activo?`<div class="row wrap" style="margin-top:10px;gap:8px">${next?`<button class="btn sm ${next[0]==="entregado"?"gold":""}" data-avanza="${esc(p.id)}" ${ro()}>${next[0]==="entregado"?"✓ Entregado y cobrado":"→ "+next[1]}</button>`:""}${wl?`<a class="wa" href="${esc(wl)}" target="_blank" rel="noopener">WhatsApp</a>`:""}<span class="grow"></span><button class="btn ghost sm" data-cancelar="${esc(p.id)}" ${ro()}>Cancelar</button></div>${p.tel?`<div class="mut small" style="margin-top:6px">Tel: ${esc(p.tel)}</div>`:""}`:""}
  </div>`;
}

async function avanzarPedido(id){
  const p=Object.assign({},S.pedidos[id]); if(!p) return;
  const idx=ESTADOS.findIndex(e=>e[0]===p.estado); if(idx<0||idx>=3) return;
  p.estado=ESTADOS[idx+1][0];
  if(p.estado==="entregado"){
    const v=await addVenta(p.items,p.metodo||"Efectivo",{origen:"pedido",cliente:p.cliente,tel:p.tel,domicilio:p.domicilio,pedidoId:id});
    p.ventaId=v.id; p.entregadoTs=Date.now(); toast("✓ Venta registrada: "+money(v.total));
    await upsertCliente(p,v.total); pruneEntregados();
  } else toast(ESTADOS[idx+1][1]);
  S.pedidos[id]=p; render(); await store.set("pedidos/"+id,p);
}
async function pruneEntregados(){ const lim=Date.now()-3*864e5; for(const [id,p] of Object.entries(S.pedidos)){ if(p&&(p.estado==="entregado"||p.estado==="cancelado")&&(p.entregadoTs||p.ts)<lim){ delete S.pedidos[id]; try{ await store.del("pedidos/"+id); }catch(e){} } } }

function cierreTexto(){
  const R=resumen(S.periodo), [a,b]=rangeFor(S.periodo), n=S.ajustes.nombre||"Pecado Capital";
  let t=`🍕 *${n.toUpperCase()} · Resumen*\n${PER_LABEL[S.periodo]} (${a===b?fechaLarga(a):fechaLarga(a)+" al "+fechaLarga(b)})\n\n💰 Ventas: ${money(R.ventas)} (${R.n} ventas, ${R.pizzas} productos)\n`;
  Object.entries(R.met).forEach(([m,v])=>{ t+=`   • ${m}: ${money(v)}\n`; });
  t+=`💸 Gastos: ${money(R.gastos)}\n✅ Ganancia: ${money(R.ganancia)}\n`;
  const top=Object.entries(R.top).sort((x,y)=>y[1].cant-x[1].cant); if(top.length){ t+=`\n🔥 Más vendidos:\n`; top.slice(0,5).forEach(([nn,v])=>{ t+=`   • ${nn}: ${v.cant}\n`; }); }
  const c=S.cajas[todayKey()]; if(S.periodo==="hoy"&&c&&c.cerrada) t+=`\n🏦 Caja: contado ${money(c.contado)} (${Math.abs(c.diferencia)<1?"cuadró":(c.diferencia>0?"sobró ":"faltó ")+money(Math.abs(c.diferencia))})\n`;
  const low=lowStock(); if(low.length) t+=`\n⚠️ Por comprar: ${low.map(i=>i.nombre).join(", ")}\n`;
  return t;
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-act]"); if(!t||t.closest("#sheet")) return; const d=t.dataset;
  if(d.per){ S.periodo=d.per; render(); return; }
  if(d.add){ S.cart[d.add]=(S.cart[d.add]||0)+1; vibe(); render(); return; }
  if(d.dec){ S.cart[d.dec]=Math.max(0,(S.cart[d.dec]||0)-1); render(); return; }
  if(d.met){ S.metodo=d.met; renderCart(); return; }
  if(d.pcat){ S.pcat=d.pcat; render(); return; }
  if(d.ptab){ S.pedTab=d.ptab; render(); return; }
  if(d.itab){ S.invTab=d.itab; render(); return; }
  if(d.hday){ S.histDay=d.hday>todayKey()?todayKey():d.hday; render(); return; }
  if(d.recibo){ const [k,id]=d.recibo.split("|"); const src=S.ventas[k]?.items||S.histCache[k]?.v||[]; const v=src.find(x=>x.id===id); if(v) showRecibo(v); return; }
  if(d.anular){ const [k,id]=d.anular.split("|"); const v=(S.ventas[k]?.items||[]).find(x=>x.id===id); if(v) confirmBox("¿Anular venta de "+money(v.total)+"?","Se quita de la caja y se devuelven los insumos.","Anular",()=>anularVenta(k,id)); return; }
  if(d.avanza){ avanzarPedido(d.avanza); return; }
  if(d.cancelar){ confirmBox("¿Cancelar este pedido?","No se registra como venta.","Cancelar pedido",async()=>{ const p=Object.assign({},S.pedidos[d.cancelar],{estado:"cancelado",entregadoTs:Date.now()}); S.pedidos[d.cancelar]=p; render(); await store.set("pedidos/"+d.cancelar,p); toast("Pedido cancelado"); }); return; }
  if(d.pedcli){ const c=S.clientes[d.pedcli]; formPedido(c?{tel:c.tel,nombre:c.nombre,dir:c.dir}:{}); return; }
  if(d.entrada){ formEntrada(d.entrada,false); return; }
  if(d.ajuste){ formEntrada(d.ajuste,true); return; }
  if(d.editins){ formInsumo(insById(d.editins)); return; }
  if(d.editprod){ formProducto(prodById(d.editprod)); return; }
  if(d.delgasto){ const [k,id]=d.delgasto.split("|"); confirmBox("¿Borrar este gasto?","","Borrar",async()=>{ const doc=dayDoc(S.gastos,k); doc.items=doc.items.filter(x=>x.id!==id); S.gastos[k]=doc; render(); await store.set("gastos/"+k,doc); toast("Gasto borrado"); }); return; }
  switch(d.act){
    case "vaciar": S.cart={}; S.descuento=0; S.recibido=""; render(); break;
    case "cobrar": { const items=cartItems(); if(!items.length) return; const metodo=S.metodo, desc=S.descuento, rec=num(S.recibido); S.cart={}; S.descuento=0; S.recibido="";
      try{ const v=await addVenta(items,metodo,{descuento:desc}); render(); toast("✓ Venta de "+money(v.total)+(metodo==="Efectivo"&&rec>v.total?" · vueltas "+money(rec-v.total):""));
        setTimeout(()=>{ if(!$("#sheet").classList.contains("open")) openSheet(`<div style="text-align:center;padding:6px 0 4px"><div style="font-size:54px">✅</div><h2 style="font-size:28px;margin:6px 0">${money(v.total)}</h2><div class="mut">${esc(metodo)}${metodo==="Efectivo"&&rec>v.total?" · Vueltas: <b style='color:var(--ok)'>"+money(rec-v.total)+"</b>":""}</div></div><div class="row" style="margin-top:18px"><button class="btn ghost grow" data-close>Listo</button><button class="btn gold grow" id="okRec">🧾 Recibo</button></div>`,b=>{ b.querySelector("[data-close]").onclick=closeSheet; b.querySelector("#okRec").onclick=()=>showRecibo(v); }); },150);
      }catch(err){ render(); } break; }
    case "nuevoPedido": formPedido(); break;
    case "nuevoIns": formInsumo(null); break;
    case "nuevoProd": formProducto(null); break;
    case "nuevoGasto": formGasto(); break;
    case "cierre": e.preventDefault(); copyOrShow(cierreTexto(),"Resumen","Resumen copiado. Pégalo en WhatsApp."); break;
    case "abrirCaja": { const base=num($("#cjBase").value), k=todayKey(), c={fecha:k,abierta:true,abiertaTs:Date.now(),base}; S.cajas[k]=c; render(); await store.set("cajas/"+k,c); toast("Caja abierta con "+money(base)); break; }
    case "cerrarCaja": { const el=$("#cjCont"); if(!el.value){ toast("Escribe cuánto efectivo contaste"); return; } const k=todayKey(), c=Object.assign({},S.cajas[k]), R=resumen("hoy"), gefe=R.gs.filter(g=>g.efectivo).reduce((a,g)=>a+g.monto,0);
      const esp=(c.base||0)+(R.met["Efectivo"]||0)-gefe, cont=num(el.value); Object.assign(c,{cerrada:true,cerradaTs:Date.now(),contado:cont,esperado:esp,diferencia:cont-esp}); S.cajas[k]=c; render(); await store.set("cajas/"+k,c); toast("Caja cerrada"); break; }
    case "reabrirCaja": { const k=todayKey(), c=Object.assign({},S.cajas[k]); delete c.cerrada; delete c.contado; delete c.diferencia; delete c.cerradaTs; delete c.esperado; S.cajas[k]=c; render(); await store.set("cajas/"+k,c); break; }
    case "guardarAjustes": { const a={nombre:$("#aNom").value.trim()||"Pecado Capital",whatsapp:$("#aWa").value.trim(),meta:num($("#aMeta").value)}; S.ajustes=a; $("#bizName").textContent=a.nombre.toUpperCase(); render(); await store.set("config/ajustes",a); toast("Ajustes guardados"); break; }
    case "respaldo": { const o={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith("pc1:")) o[k]=localStorage.getItem(k); } }catch(err){} copyOrShow("PECADO-RESPALDO:"+JSON.stringify(o),"Respaldo","Respaldo copiado. Guárdalo en un lugar seguro."); break; }
    case "restaurar": openSheet(`<h2 style="font-size:24px">Restaurar respaldo</h2><div class="mut small">Pega aquí el texto del respaldo. Reemplaza los datos de este teléfono.</div><textarea class="inp" id="rsTxt" style="height:200px;margin-top:10px;font-size:12px"></textarea><button class="btn block" id="rsOk" style="margin-top:12px">Restaurar</button>`,b=>{ b.querySelector("#rsOk").onclick=()=>{ try{ const t=b.querySelector("#rsTxt").value.trim().replace(/^PECADO-RESPALDO:/,""); const o=JSON.parse(t); const ks=Object.keys(o).filter(k=>k.startsWith("pc1:")); if(!ks.length) throw 0; const old=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith("pc1:")) old.push(k); } old.forEach(k=>localStorage.removeItem(k)); ks.forEach(k=>localStorage.setItem(k,o[k])); closeSheet(); toast("Respaldo restaurado"); setTimeout(()=>location.reload(),700); }catch(err){ toast("Ese texto no es un respaldo válido"); } }; }); break;
    case "exportar": { let t="Tipo\tFecha\tHora\tDetalle\tCategoría/Pago\tValor\n";
      collectR(S.ventas,"0000","9999").reverse().forEach(v=>{ t+=`Venta\t${v._k}\t${hora(v.ts)}\t${v.items.map(i=>i.cant+"x "+i.nombre).join(", ")}\t${v.metodo}\t${v.total}\n`; });
      collectR(S.gastos,"0000","9999").reverse().forEach(g=>{ t+=`Gasto\t${g._k}\t${hora(g.ts)}\t${g.concepto}\t${g.categoria}\t${-g.monto}\n`; });
      copyOrShow(t,"Ventas y gastos","Copiado. Pégalo en Excel o Google Sheets."); break; }
  }
});
})();
</script>
</body>
</html>
